server:
  port: 8080
spring:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: false
  grpc:
    server:
      port: 9090
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      enable:
        idempotence: "true"
      acks: "all"
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "org.springframework.kafka.support.serializer.JsonSerializer"
hotelio:
  service:
    user:
      host: ${HOTELIO_MONOLITH_HOST}
      port: ${HOTELIO_MONOLITH_PORT}
    review:
      host: ${HOTELIO_MONOLITH_HOST}
      port: ${HOTELIO_MONOLITH_PORT}
    promo:
      host: ${HOTELIO_MONOLITH_HOST}
      port: ${HOTELIO_MONOLITH_PORT}
    hotel:
      host: ${HOTELIO_MONOLITH_HOST}
      port: ${HOTELIO_MONOLITH_PORT}
