version: "3.8"

services:
  monolith:
    build:
      context: hotelio-monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
      - "8184:8180"
    networks:
      - hotelio-net
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8180"
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      use-external-booking: true
      BOOKING_SERVICE_EXTERNAL_HOST: booking
      BOOKING_SERVICE_EXTERNAL_PORT: 9090
    depends_on:
      - monolith-db
  monolith-db:
    image: postgres:17
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  booking:
    build:
      context: booking
      dockerfile: Dockerfile
    container_name: booking
    ports:
      - "9090:9090"
      - "8085:8080"
      - "8185:8180"
    networks:
      - hotelio-net
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8180"
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5431/booking
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: booking
      HOTELIO_MONOLITH_HOST: hotelio-monolith
      HOTELIO_MONOLITH_PORT: 8080
      KAFKA_SERVER: "http://kafka:9092"
    depends_on:
      - booking-db
  booking-db:
    image: postgres:17
    container_name: booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
      PGPORT: 5431
    ports:
      - "5431:5431"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  booking-statistics:
    build:
      context: booking-statistics
      dockerfile: Dockerfile
    container_name: booking-statistics
    ports:
      - "8086:8080"
      - "8186:8180"
    networks:
      - hotelio-net
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8180"
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-statistics-db:5430/booking-statistics
      SPRING_DATASOURCE_USERNAME: booking-statistics
      SPRING_DATASOURCE_PASSWORD: booking-statistics
      KAFKA_SERVER: "http://kafka:9092"
    depends_on:
      - booking-statistics-db
  booking-statistics-db:
    image: postgres:17
    container_name: booking-statistics-db
    environment:
      POSTGRES_USER: booking-statistics
      POSTGRES_PASSWORD: booking-statistics
      POSTGRES_DB: booking-statistics
      PGPORT: 5430
    ports:
      - "5430:5430"
    volumes:
      - booking-statistics-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  monolith-db-data:
  booking-db-data:
  booking-statistics-db-data:
networks:
  hotelio-net:
    driver: bridge
