spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: false
  grpc:
    client:
      channels:
        booking:
          address: ${BOOKING_SERVICE_EXTERNAL_HOST}:${BOOKING_SERVICE_EXTERNAL_PORT}
use-external-booking: true